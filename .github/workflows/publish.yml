name: Build and publish Cromosim

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example v3.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Build regular CPython wheels for every Python version advertised by Cromosim.
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  # Do not build Windows 32-bit / Linux 32-bit wheels
  CIBW_ARCHS: "auto64"
  CIBW_TEST_REQUIRES: "pytest>=7"
  CIBW_TEST_COMMAND: "python -m pytest {project}/tests -v"

jobs:
  check-version:
    name: Check tag and package version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tag matches pyproject.toml
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with 'v': {tag}")

          tag_version = tag[1:]
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = data["project"]["version"]

          print(f"Git tag version : {tag_version}")
          print(f"Package version : {package_version}")

          if tag_version != package_version:
              raise SystemExit(
                  f"Tag {tag!r} does not match pyproject.toml version "
                  f"{package_version!r}"
              )
          PY

  build-sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build source distribution
        run: python -m build --sdist

      - name: Check source distribution
        run: python -m twine check dist/*

      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15-intel
          - macos-15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish Cromosim to PyPI
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/cromosim

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Show distributions to publish
        run: ls -lh dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
